<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANO_VIEWER HUD - Walkthrough Editor & Custom Cursor</title>
    
    <!-- Pannellum CDN CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Rajdhani', sans-serif;
            color: #00f0ff;
        }

        /* HIDE DEFAULT CURSOR FOR CANVAS WHEN CUSTOM CURSOR IS ACTIVE */
        body.custom-cursor-active, 
        body.custom-cursor-active * {
            cursor: none !important;
        }

        #panorama {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* CUSTOM CURSOR OVERLAY ELEMENTS */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Style 1: Crosshair */
        .cursor-crosshair {
            border: 1px solid #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }
        .cursor-crosshair::after {
            content: '';
            width: 4px;
            height: 4px;
            background: #00f0ff;
            border-radius: 50%;
        }

        /* Style 2: Target Ring */
        .cursor-target {
            border: 2px dashed #00ffaa;
            border-radius: 50%;
            animation: spin 6s linear infinite;
            box-shadow: 0 0 10px #00ffaa;
        }

        /* Style 3: Laser Dot */
        .cursor-laser {
            width: 10px !important;
            height: 10px !important;
            background: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff0055, 0 0 20px #ff0055;
        }

        @keyframes spin {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Sci-Fi HUD Overlay Container */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.15);
        }

        .hud-overlay * {
            pointer-events: auto;
        }

        /* Top Header HUD Bar */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-left: 4px solid #00f0ff;
            padding: 12px 24px;
            border-radius: 4px;
        }

        .hud-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-logo {
            width: 12px;
            height: 12px;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulse 2s infinite;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }

        .hud-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #00ffaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* Node Repositioning Toolbar Panel */
        #editor-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 310px;
            background: rgba(5, 15, 30, 0.85);
            border: 1px solid #00f0ff;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .editor-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #fff;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 5px;
            margin-bottom: 2px;
        }

        .coord-display {
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 240, 255, 0.1);
            padding: 8px;
            border-radius: 4px;
            border: 1px dashed #00f0ff;
            color: #00ffaa;
        }

        .editor-input, .editor-select {
            width: 100%;
            padding: 8px;
            background: #050b14;
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: #00f0ff;
            font-family: 'Rajdhani', sans-serif;
            border-radius: 4px;
            outline: none;
        }

        .editor-btn {
            background: #00f0ff;
            color: #050b14;
            border: none;
            padding: 8px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .editor-btn:hover {
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa;
        }

        .editor-btn.export {
            background: #ff0055;
            color: #fff;
        }
        .editor-btn.export:hover {
            background: #ff3377;
            box-shadow: 0 0 10px #ff0055;
        }

        /* Bottom HUD Navigation Control */
        .hud-nav-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(5, 15, 30, 0.8);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 30px;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .hud-btn:hover, .hud-btn.active {
            background: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 15px #00f0ff;
            font-weight: bold;
        }

        /* Footer Copyright Tag */
        .hud-copyright {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body class="custom-cursor-active">

    <!-- Panorama Canvas -->
    <div id="panorama"></div>

    <!-- Custom Pointer Element -->
    <div id="custom-cursor" class="cursor-crosshair"></div>

    <!-- HUD Overlay -->
    <div class="hud-overlay">
        <!-- Header -->
        <div class="hud-header">
            <div class="hud-title-box">
                <div class="hud-logo"></div>
                <div class="hud-title">Pano_Viewer Configurator</div>
            </div>
            <div class="hud-status">
                <div class="status-dot"></div>
                SYSTEM ACTIVE
            </div>
        </div>

        <!-- Node Configuration Panel -->
        <div id="editor-panel">
            <div class="editor-title">🎯 LIVE NODE POSITIONING</div>
            
            <div class="coord-display">
                PITCH: <span id="val-pitch">0.0</span>°<br>
                YAW: <span id="val-yaw">0.0</span>°
            </div>

            <input type="text" id="hotspot-text" class="editor-input" placeholder="Hotspot Label" value="ENTER INTERIOR">
            
            <select id="target-scene" class="editor-select">
                <option value="stairway">Target: Stairway</option>
                <option value="interior">Target: Interior</option>
                <option value="meeting_room">Target: Meeting Room</option>
                <option value="museum">Target: Museum</option>
            </select>

            <button class="editor-btn" onclick="addNodeToCurrentScene()">➕ Place Node Here</button>

            <div class="editor-title" style="margin-top: 5px;">🖱️ APP CURSOR STYLE</div>
            <select id="cursor-select" class="editor-select" onchange="changeCursorStyle(this.value)">
                <option value="cursor-crosshair" selected>Sci-Fi Crosshair</option>
                <option value="cursor-target">Target Ring</option>
                <option value="cursor-laser">Laser Pointer</option>
                <option value="default">Default OS Cursor</option>
            </select>

            <button class="editor-btn export" onclick="exportConfig()" style="margin-top: 5px;">💾 Export Saved Config</button>
        </div>

        <!-- Navigation HUD Toolbar -->
        <div class="hud-nav-bar">
            <button class="hud-btn active" id="btn-stairway" onclick="switchScene('stairway')">Stairway</button>
            <button class="hud-btn" id="btn-interior" onclick="switchScene('interior')">Interior</button>
            <button class="hud-btn" id="btn-meeting_room" onclick="switchScene('meeting_room')">Meeting Room</button>
            <button class="hud-btn" id="btn-museum" onclick="switchScene('museum')">Museum</button>
        </div>

        <!-- Proprietary Tag -->
        <div class="hud-copyright">
            PROPRIETARY TOOL © Rituraj_Gogoi
        </div>
    </div>

<script>
    // App Configuration Tree
    var appConfig = {
        "activeCursorStyle": "cursor-crosshair",
        "scenes": {
            "stairway": {
                "title": "Church Stairway Entrance",
                "hfov": 100,
                "pitch": 0,
                "yaw": 0,
                "type": "equirectangular",
                "panorama": "church_stairway_4k.jpg",
                "hotSpots": [
                    { "pitch": 12.0, "yaw": 18.0, "type": "scene", "text": "ENTER INTERIOR MAIN HALL", "sceneId": "interior" },
                    { "pitch": -10.0, "yaw": -25.0, "type": "scene", "text": "GO TO MUSEUM", "sceneId": "museum" }
                ]
            },
            "interior": {
                "title": "Church Interior Hall",
                "hfov": 100,
                "pitch": 0,
                "yaw": 0,
                "type": "equirectangular",
                "panorama": "church_interior_4k.jpg",
                "hotSpots": [
                    { "pitch": -1.0, "yaw": -120.0, "type": "scene", "text": "EXIT TO STAIRWAY", "sceneId": "stairway" },
                    { "pitch": 0.0, "yaw": 60.0, "type": "scene", "text": "ENTER MEETING ROOM", "sceneId": "meeting_room" },
                    { "pitch": 0.0, "yaw": -60.0, "type": "scene", "text": "ENTER MUSEUM", "sceneId": "museum" }
                ]
            },
            "meeting_room": {
                "title": "Church Meeting Room",
                "hfov": 100,
                "pitch": 0,
                "yaw": 0,
                "type": "equirectangular",
                "panorama": "church_meeting_room_4k.jpg",
                "hotSpots": [
                    { "pitch": -2.0, "yaw": 180.0, "type": "scene", "text": "RETURN TO INTERIOR", "sceneId": "interior" }
                ]
            },
            "museum": {
                "title": "Church Museum",
                "hfov": 100,
                "pitch": 0,
                "yaw": 0,
                "type": "equirectangular",
                "panorama": "church_museum_4k.jpg",
                "hotSpots": [
                    { "pitch": -2.0, "yaw": 160.0, "type": "scene", "text": "RETURN TO INTERIOR", "sceneId": "interior" }
                ]
            }
        }
    };

    var currentClickCoords = { pitch: 0, yaw: 0 };
    const cursorElem = document.getElementById('custom-cursor');

    // Custom Mouse Tracker Handler
    window.addEventListener('mousemove', (e) => {
        cursorElem.style.left = e.clientX + 'px';
        cursorElem.style.top = e.clientY + 'px';
    });

    // Change Inbuilt App Cursor Style Function
    function changeCursorStyle(styleClass) {
        appConfig.activeCursorStyle = styleClass;
        cursorElem.className = ''; // Clear classes
        
        if (styleClass === 'default') {
            document.body.classList.remove('custom-cursor-active');
            cursorElem.style.display = 'none';
        } else {
            document.body.classList.add('custom-cursor-active');
            cursorElem.style.display = 'flex';
            cursorElem.classList.add(styleClass);
        }
    }

    // Initialize Viewer
    var viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "stairway",
            "author": "Rituraj_Gogoi",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": false,
            "hotSpotDebug": false
        },
        "scenes": appConfig.scenes
    });

    // Position Calculator on Click
    document.getElementById('panorama').addEventListener('mousedown', function(event) {
        var coords = viewer.canvasToFinalBounds(event);
        if(coords) {
            currentClickCoords.pitch = parseFloat(coords[0].toFixed(2));
            currentClickCoords.yaw = parseFloat(coords[1].toFixed(2));

            document.getElementById('val-pitch').innerText = currentClickCoords.pitch;
            document.getElementById('val-yaw').innerText = currentClickCoords.yaw;
        }
    });

    // Add New Node Dynamically
    function addNodeToCurrentScene() {
        var activeScene = viewer.getScene();
        var labelText = document.getElementById('hotspot-text').value;
        var targetScene = document.getElementById('target-scene').value;

        var newHotspot = {
            "pitch": currentClickCoords.pitch,
            "yaw": currentClickCoords.yaw,
            "type": "scene",
            "text": labelText,
            "sceneId": targetScene
        };

        viewer.addHotSpot(newHotspot, activeScene);
        appConfig.scenes[activeScene].hotSpots.push(newHotspot);

        alert('Node Placed in ' + activeScene + '!\nPitch: ' + currentClickCoords.pitch + ' | Yaw: ' + currentClickCoords.yaw);
    }

    // Export Complete Config (Node positions + Cursor Choice)
    function exportConfig() {
        var formattedData = "var appConfig = " + JSON.stringify(appConfig, null, 4) + ";";
        
        navigator.clipboard.writeText(formattedData);
        alert("Configuration & Cursor choice copied to clipboard!");

        var blob = new Blob([formattedData], { type: "text/javascript" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "app_config.js";
        a.click();
    }

    // Navigation state handlers
    function switchScene(sceneId) {
        viewer.loadScene(sceneId);
        updateNavState(sceneId);
    }

    viewer.on('scenechange', function(sceneId) {
        updateNavState(sceneId);
    });

    function updateNavState(sceneId) {
        document.querySelectorAll('.hud-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('btn-' + sceneId);
        if (activeBtn) activeBtn.classList.add('active');
    }
</script>

</body>
</html>
