<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pano_Viewer - 360 Walkthrough</title>

    <!-- Three.js Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none; /* Prevents mobile browser scrolling/pull-refresh */
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            overflow: hidden;
            background: #000;
            font-family: 'Rajdhani', sans-serif;
        }

        #webgl-container {
            width: 100vw;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD TOP BAR */
        .hud-header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(5, 15, 30, 0.8);
            border: 1px solid #00f0ff;
            border-left: 4px solid #00f0ff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
            border-radius: 4px;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #fff;
            letter-spacing: 1.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hud-badge {
            font-size: 10px;
            background: #00ffaa;
            color: #000;
            padding: 2px 6px;
            font-weight: bold;
            border-radius: 3px;
            white-space: nowrap;
        }

        /* CENTER RETICLE */
        .center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .center-crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00f0ff;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            box-shadow: 0 0 6px #00f0ff;
        }

        /* ROOM NAVIGATION BAR */
        .hud-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(5, 15, 30, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #00f0ff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            max-width: 95vw;
            overflow-x: auto;
            scrollbar-width: none; /* Hide scrollbar Firefox */
            touch-action: pan-x; /* Allow horizontal button scroll on tiny screens */
        }

        .hud-nav::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .nav-btn.active, .nav-btn:active {
            background: #00f0ff;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px #00f0ff;
        }

        .hud-copy {
            position: absolute;
            bottom: 6px;
            right: 12px;
            z-index: 10;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }

        /* DESKTOP HOVER STYLES */
        @media (hover: hover) and (pointer: fine) {
            .nav-btn:hover {
                background: #00f0ff;
                color: #000;
                font-weight: bold;
                box-shadow: 0 0 10px #00f0ff;
            }
        }

        /* MOBILE RESPONSIVE TWEAKS */
        @media (max-width: 600px) {
            .hud-header {
                top: 8px;
                left: 8px;
                right: 8px;
                padding: 6px 10px;
            }

            .hud-title {
                font-size: 11px;
                letter-spacing: 1px;
            }

            .hud-badge {
                font-size: 9px;
                padding: 1px 4px;
            }

            .hud-nav {
                bottom: 15px;
                padding: 5px 8px;
                gap: 6px;
                border-radius: 16px;
            }

            .nav-btn {
                padding: 6px 10px;
                font-size: 10px;
                border-radius: 10px;
            }

            .hud-copy {
                font-size: 8px;
                bottom: 4px;
                right: 8px;
            }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="center-crosshair"></div>

    <div class="hud-header">
        <div class="hud-title">PANO_VIEWER HUD TOUR</div>
        <div class="hud-badge">SYSTEM ACTIVE</div>
    </div>

    <!-- ROOM NAVIGATION BAR -->
    <div class="hud-nav">
        <button class="nav-btn active" id="btn-stairway" onclick="loadRoom('stairway')">Stairway</button>
        <button class="nav-btn" id="btn-interior" onclick="loadRoom('interior')">Interior</button>
        <button class="nav-btn" id="btn-meeting_room" onclick="loadRoom('meeting_room')">Meeting Room</button>
        <button class="nav-btn" id="btn-museum" onclick="loadRoom('museum')">Museum</button>
    </div>

    <div class="hud-copy">PROPRIETARY TOOL © Rituraj_Gogoi</div>

<script>
    // HARDCODED PERMANENT APP CONFIGURATION WITH ALL NODES
    var appData = {
        "scenes": {
            "stairway": {
                "panorama": "church_stairway_4k.jpg",
                "nodes": [
                    {
                        "id": "node_1789124474474",
                        "x": 34.81,
                        "y": 0.26,
                        "z": -35.79,
                        "text": "ENTER INTERIOR MAIN HALL",
                        "target": "interior"
                    }
                ]
            },
            "interior": {
                "panorama": "church_interior_4k.jpg",
                "nodes": [
                    {
                        "id": "node_1789124537805",
                        "x": -40.43,
                        "y": -2,
                        "z": -29.27,
                        "text": "ENTER MEETING ROOM",
                        "target": "meeting_room"
                    },
                    {
                        "id": "node_1789124561975",
                        "x": -29.37,
                        "y": -1.05,
                        "z": 40.42,
                        "text": "EXIT TO STAIRWAY",
                        "target": "stairway"
                    },
                    {
                        "id": "node_1789124581269",
                        "x": 40.29,
                        "y": -1.74,
                        "z": 29.48,
                        "text": "ENTER MUSEUM",
                        "target": "museum"
                    }
                ]
            },
            "meeting_room": {
                "panorama": "church_meeting_room_4k.jpg",
                "nodes": [
                    {
                        "id": "node_1789124606895",
                        "x": -25.62,
                        "y": -2.09,
                        "z": 42.8,
                        "text": "GOTO STAIRWAY",
                        "target": "stairway"
                    },
                    {
                        "id": "node_1789124615359",
                        "x": 45.07,
                        "y": 1.57,
                        "z": -21.4,
                        "text": "RETURN TO INTERIOR",
                        "target": "interior"
                    }
                ]
            },
            "museum": {
                "panorama": "church_museum_4k.jpg",
                "nodes": [
                    {
                        "id": "node_1789124629455",
                        "x": 0.35,
                        "y": -1.66,
                        "z": 49.92,
                        "text": "RETURN TO INTERIOR",
                        "target": "interior"
                    },
                    {
                        "id": "node_1789124636103",
                        "x": -49.51,
                        "y": 0.17,
                        "z": -6.52,
                        "text": "GOTO STAIRWAY",
                        "target": "stairway"
                    }
                ]
            }
        }
    };

    var activeScene = 'stairway';
    var nodeMeshes = [];

    // THREE.JS SYSTEM VARIABLES
    var scene, camera, renderer, sphereMesh, raycaster, mouse;
    var isUserInteracting = false, onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    var lon = 0, onPointerDownLon = 0, lat = 0, onPointerDownLat = 0, phi = 0, theta = 0;

    initThreeJS();
    animate();

    function initThreeJS() {
        var container = document.getElementById('webgl-container');

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
        camera.target = new THREE.Vector3(0, 0, 0);

        // 3D Panorama Sphere
        var geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1);

        var textureLoader = new THREE.TextureLoader();
        var texture = textureLoader.load(appData.scenes[activeScene].panorama);
        var material = new THREE.MeshBasicMaterial({ map: texture });

        sphereMesh = new THREE.Mesh(geometry, material);
        scene.add(sphereMesh);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // High-DPI screen support
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // UNIVERSAL POINTER EVENTS (TOUCH & MOUSE)
        container.addEventListener('pointerdown', onPointerDown, false);
        container.addEventListener('pointermove', onPointerMove, false);
        container.addEventListener('pointerup', onPointerUp, false);
        window.addEventListener('resize', onWindowResize, false);

        renderNodes3D();
    }

    // RENDER COMPACT 3D NODES
    function renderNodes3D() {
        nodeMeshes.forEach(mesh => scene.remove(mesh));
        nodeMeshes = [];

        var nodes = appData.scenes[activeScene].nodes;
        nodes.forEach(function(n) {
            // Node sphere radius 0.8
            var nodeGeo = new THREE.SphereGeometry(0.8, 12, 12);
            var nodeMat = new THREE.MeshBasicMaterial({ 
                color: 0x00f0ff, 
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });
            var nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);

            nodeMesh.position.set(n.x, n.y, n.z);
            nodeMesh.userData = n;

            scene.add(nodeMesh);
            nodeMeshes.push(nodeMesh);
        });
    }

    function onPointerDown(event) {
        // Ignore drag initiation if tapping near the bottom navigation bar
        if (event.clientY > window.innerHeight - 70) return;

        isUserInteracting = true;
        onPointerDownPointerX = event.clientX;
        onPointerDownPointerY = event.clientY;

        onPointerDownLon = lon;
        onPointerDownLat = lat;

        // RAYCAST HIT DETECTION FOR MOBILE TOUCH AND MOUSE
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        
        // Increase raycaster precision threshold for mobile touch taps
        raycaster.params.Points.threshold = 1.5;
        var intersects = raycaster.intersectObjects(nodeMeshes);

        if (intersects.length > 0) {
            var clickedNode = intersects[0].object;
            loadRoom(clickedNode.userData.target);
        }
    }

    function onPointerMove(event) {
        if (isUserInteracting === true) {
            // Drag sensitivity factor adjusted for touch screens
            var sensitivity = window.innerWidth < 600 ? 0.15 : 0.1;
            lon = (onPointerDownPointerX - event.clientX) * sensitivity + onPointerDownLon;
            lat = (event.clientY - onPointerDownPointerY) * sensitivity + onPointerDownLat;
        }
    }

    function onPointerUp() {
        isUserInteracting = false;
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
    }

    function update() {
        lat = Math.max(-85, Math.min(85, lat));
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);

        camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
        camera.target.y = 500 * Math.cos(phi);
        camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

        camera.lookAt(camera.target);

        // Slow rotation animation for 3D nodes
        nodeMeshes.forEach(mesh => {
            mesh.rotation.y += 0.02;
        });

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ROOM SWITCHING FUNCTION
    function loadRoom(roomKey) {
        activeScene = roomKey;

        var textureLoader = new THREE.TextureLoader();
        textureLoader.load(appData.scenes[roomKey].panorama, function(tex) {
            sphereMesh.material.map = tex;
            sphereMesh.material.needsUpdate = true;
            renderNodes3D();
        });

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        var btn = document.getElementById('btn-' + roomKey);
        if (btn) btn.classList.add('active');
    }
</script>
</body>
</html>
