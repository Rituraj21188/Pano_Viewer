<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANO_VIEWER Three.js 3D Editor</title>

    <!-- Three.js Engine & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }

        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD TOP BAR */
        .hud-header {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10;
            background: rgba(5, 15, 30, 0.85); border: 1px solid #00f0ff; border-left: 5px solid #00f0ff;
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(8px); pointer-events: none;
        }
        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; letter-spacing: 2px; }
        .hud-badge { font-size: 11px; background: #00ffaa; color: #000; padding: 2px 8px; font-weight: bold; border-radius: 3px; }

        /* EDITOR PANEL */
        #editor-panel {
            position: absolute; top: 75px; right: 15px; z-index: 1000; width: 330px;
            background: rgba(5, 15, 30, 0.92); border: 1px solid rgba(0,240,255,0.6);
            padding: 15px; border-radius: 8px; color: #00f0ff; backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); display: flex; flex-direction: column; gap: 8px;
        }
        .panel-title { font-family: 'Orbitron', sans-serif; font-size: 12px; color: #fff; border-bottom: 1px solid rgba(0,240,255,0.3); padding-bottom: 4px; }
        
        .field-group { display: flex; flex-direction: column; gap: 3px; }
        .field-label { font-size: 11px; color: rgba(255,255,255,0.7); }
        .editor-input, .editor-select {
            background: #050b14; border: 1px solid #00f0ff; color: #00f0ff;
            padding: 8px; font-family: 'Rajdhani', sans-serif; font-size: 13px; outline: none; border-radius: 4px;
        }

        .btn {
            background: #00f0ff; color: #000; border: none; padding: 10px;
            font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: 0.2s; border-radius: 4px; text-transform: uppercase;
        }
        .btn:hover { background: #00ffaa; box-shadow: 0 0 12px #00ffaa; }
        .btn-danger { background: #ff0055; color: #fff; }
        .btn-danger:hover { background: #ff3377; box-shadow: 0 0 12px #ff0055; }
        .btn-save { background: #00ffaa; color: #000; }

        /* CENTER AIM CROSSHAIR */
        .center-crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; border: 1px solid rgba(0, 240, 255, 0.6); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        .center-crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: #00f0ff; transform: translate(-50%, -50%); border-radius: 50%;
            box-shadow: 0 0 8px #00f0ff;
        }

        /* BOTTOM NAVBAR */
        .hud-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; gap: 10px; background: rgba(5, 15, 30, 0.85); padding: 8px 16px;
            border-radius: 20px; border: 1px solid #00f0ff; backdrop-filter: blur(8px);
        }
        .nav-btn {
            background: transparent; border: 1px solid rgba(0,240,255,0.4); color: #00f0ff;
            padding: 6px 14px; font-family: 'Orbitron', sans-serif; font-size: 11px; cursor: pointer; border-radius: 12px;
        }
        .nav-btn.active, .nav-btn:hover { background: #00f0ff; color: #000; font-weight: bold; }

        .hud-copy { position: absolute; bottom: 10px; right: 15px; z-index: 10; font-size: 10px; color: rgba(255,255,255,0.4); font-family: 'Orbitron'; pointer-events: none; }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="center-crosshair"></div>

    <div class="hud-header">
        <div class="hud-title">PANO_VIEWER THREE.JS 3D EDITOR</div>
        <div class="hud-badge">RAYCASTING: ACTIVE</div>
    </div>

    <!-- CONTROL PANEL -->
    <div id="editor-panel">
        <div class="panel-title">🎯 LIVE 3D NODE PLACEMENT</div>
        
        <div class="field-group">
            <span class="field-label">NODE LABEL TEXT</span>
            <input type="text" id="node-text" class="editor-input" value="ENTER ROOM">
        </div>

        <div class="field-group">
            <span class="field-label">TARGET DESTINATION ROOM</span>
            <select id="node-target" class="editor-select">
                <option value="stairway">Stairway</option>
                <option value="interior">Interior</option>
                <option value="meeting_room">Meeting Room</option>
                <option value="museum">Museum</option>
            </select>
        </div>

        <button class="btn" onclick="placeNodeAtCenterAim()">🎯 PLACE NODE AT CENTER AIM</button>
        <button class="btn btn-danger" onclick="deleteSelectedNode()">🗑️ DELETE SELECTED NODE</button>
        <button class="btn btn-save" onclick="saveConfigurationPermanently()">💾 SAVE LAYOUT TO APP</button>
    </div>

    <!-- ROOM NAVIGATION BAR -->
    <div class="hud-nav">
        <button class="nav-btn active" id="btn-stairway" onclick="loadRoom('stairway')">Stairway</button>
        <button class="nav-btn" id="btn-interior" onclick="loadRoom('interior')">Interior</button>
        <button class="nav-btn" id="btn-meeting_room" onclick="loadRoom('meeting_room')">Meeting Room</button>
        <button class="nav-btn" id="btn-museum" onclick="loadRoom('museum')">Museum</button>
    </div>

    <div class="hud-copy">PROPRIETARY TOOL © Rituraj_Gogoi</div>

<script>
    // DATA TREE & PERSISTENT STORAGE
    var defaultData = {
        "scenes": {
            "stairway": {
                "panorama": "church_stairway_4k.jpg",
                "nodes": [
                    { "id": "node_1", "x": 12.5, "y": 8.2, "z": -47.1, "text": "ENTER INTERIOR MAIN HALL", "target": "interior" },
                    { "id": "node_2", "x": -22.1, "y": -5.4, "z": -44.2, "text": "GO TO MUSEUM", "target": "museum" }
                ]
            },
            "interior": {
                "panorama": "church_interior_4k.jpg",
                "nodes": [
                    { "id": "node_3", "x": -42.1, "y": -2.1, "z": 26.5, "text": "EXIT TO STAIRWAY", "target": "stairway" }
                ]
            },
            "meeting_room": {
                "panorama": "church_meeting_room_4k.jpg",
                "nodes": [
                    { "id": "node_4", "x": 0.0, "y": -2.0, "z": 49.0, "text": "RETURN TO INTERIOR", "target": "interior" }
                ]
            },
            "museum": {
                "panorama": "church_museum_4k.jpg",
                "nodes": [
                    { "id": "node_5", "x": 18.0, "y": -1.5, "z": 46.2, "text": "RETURN TO INTERIOR", "target": "interior" }
                ]
            }
        }
    };

    var appData = JSON.parse(localStorage.getItem('THREE_PANO_CONFIG')) || defaultData;
    var activeScene = 'stairway';
    var selectedNodeMesh = null;
    var nodeMeshes = [];

    // THREE.JS CORE VARIABLES
    var scene, camera, renderer, sphereMesh, raycaster, mouse;
    var isUserInteracting = false, onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    var lon = 0, onPointerDownLon = 0, lat = 0, onPointerDownLat = 0, phi = 0, theta = 0;

    initThreeJS();
    animate();

    function initThreeJS() {
        var container = document.getElementById('webgl-container');

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
        camera.target = new THREE.Vector3(0, 0, 0);

        // 3D Sphere Geometry
        var geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1); // Invert sphere inside out

        var textureLoader = new THREE.TextureLoader();
        var texture = textureLoader.load(appData.scenes[activeScene].panorama);
        var material = new THREE.MeshBasicMaterial({ map: texture });

        sphereMesh = new THREE.Mesh(geometry, material);
        scene.add(sphereMesh);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // DRAG ENGINE & CONTROLS
        document.addEventListener('pointerdown', onPointerDown);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
        window.addEventListener('resize', onWindowResize);

        renderNodes3D();
    }

    // RENDER HOTSPOTS DIRECTLY INTO 3D SPACE
    function renderNodes3D() {
        // Clear existing node meshes
        nodeMeshes.forEach(mesh => scene.remove(mesh));
        nodeMeshes = [];

        var nodes = appData.scenes[activeScene].nodes;
        nodes.forEach(function(n) {
            // Create glowing 3D Node Sphere
            var nodeGeo = new THREE.SphereGeometry(2.5, 16, 16);
            var nodeMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
            var nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);

            nodeMesh.position.set(n.x, n.y, n.z);
            nodeMesh.userData = n;

            scene.add(nodeMesh);
            nodeMeshes.push(nodeMesh);
        });
    }

    // PLACE NODE AT CENTER AIM
    function placeNodeAtCenterAim() {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        var intersects = raycaster.intersectObject(sphereMesh);

        if (intersects.length > 0) {
            var point = intersects[0].point;

            // Scale vector closer inside the sphere for visibility
            var scaledPoint = point.clone().multiplyScalar(0.1);

            var text = document.getElementById('node-text').value;
            var target = document.getElementById('node-target').value;
            var newId = "node_" + Date.now();

            var newNode = {
                "id": newId,
                "x": parseFloat(scaledPoint.x.toFixed(2)),
                "y": parseFloat(scaledPoint.y.toFixed(2)),
                "z": parseFloat(scaledPoint.z.toFixed(2)),
                "text": text,
                "target": target
            };

            appData.scenes[activeScene].nodes.push(newNode);
            renderNodes3D();

            alert("3D Node Placed Successfully at current view vector!");
        }
    }

    // DELETE SELECTED NODE
    function deleteSelectedNode() {
        if (!selectedNodeMesh) return alert("Click a 3D Node sphere in the panorama to select it first!");
        
        var idToDelete = selectedNodeMesh.userData.id;
        appData.scenes[activeScene].nodes = appData.scenes[activeScene].nodes.filter(n => n.id !== idToDelete);
        
        selectedNodeMesh = null;
        renderNodes3D();
    }

    // DRAG ROTATION ENGINE
    function onPointerDown(event) {
        if (event.clientY < 60 || event.clientX > window.innerWidth - 340) return; // Prevent drag when clicking UI

        isUserInteracting = true;
        onPointerDownPointerX = event.clientX;
        onPointerDownPointerY = event.clientY;

        onPointerDownLon = lon;
        onPointerDownLat = lat;

        // RAYCAST CLICK ON 3D NODES
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(nodeMeshes);

        if (intersects.length > 0) {
            var clickedNode = intersects[0].object;
            selectedNodeMesh = clickedNode;

            // Highlight Node
            nodeMeshes.forEach(m => m.material.color.setHex(0x00f0ff));
            clickedNode.material.color.setHex(0xff0055);

            // Double Click to Navigate
            if (event.detail === 2) {
                loadRoom(clickedNode.userData.target);
            }
        }
    }

    function onPointerMove(event) {
        if (isUserInteracting === true) {
            lon = (onPointerDownPointerX - event.clientX) * 0.1 + onPointerDownLon;
            lat = (event.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
        }
    }

    function onPointerUp() {
        isUserInteracting = false;
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
    }

    function update() {
        lat = Math.max(-85, Math.min(85, lat));
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);

        camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
        camera.target.y = 500 * Math.cos(phi);
        camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

        camera.lookAt(camera.target);

        // Pulse selected Node
        if (selectedNodeMesh) {
            selectedNodeMesh.rotation.y += 0.05;
        }

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ROOM SWITCHING
    function loadRoom(roomKey) {
        activeScene = roomKey;
        selectedNodeMesh = null;

        var textureLoader = new THREE.TextureLoader();
        textureLoader.load(appData.scenes[roomKey].panorama, function(tex) {
            sphereMesh.material.map = tex;
            sphereMesh.material.needsUpdate = true;
            renderNodes3D();
        });

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        var btn = document.getElementById('btn-' + roomKey);
        if (btn) btn.classList.add('active');
    }

    function saveConfigurationPermanently() {
        localStorage.setItem('THREE_PANO_CONFIG', JSON.stringify(appData));
        alert("LAYOUT SAVED SUCCESSFULLY!\n3D Node coordinates are stored inside browser memory and will auto-load.");
    }
</script>
</body>
</html>
