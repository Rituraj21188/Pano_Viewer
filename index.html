<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANO_VIEWER HUD - Walkthrough Editor</title>
    
    <!-- Pannellum CDN CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Rajdhani', sans-serif;
            color: #00f0ff;
        }

        #panorama {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Sci-Fi HUD Overlay Container */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.15);
        }

        .hud-overlay * {
            pointer-events: auto;
        }

        /* Top Header HUD Bar */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-left: 4px solid #00f0ff;
            padding: 12px 24px;
            border-radius: 4px;
        }

        .hud-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-logo {
            width: 12px;
            height: 12px;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulse 2s infinite;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }

        .hud-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #00ffaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* Node Repositioning Toolbar Panel */
        #editor-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 310px;
            background: rgba(5, 15, 30, 0.85);
            border: 1px solid #00f0ff;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .editor-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #fff;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .coord-display {
            font-family: monospace;
            font-size: 13px;
            background: rgba(0, 240, 255, 0.1);
            padding: 8px;
            border-radius: 4px;
            border: 1px dashed #00f0ff;
            color: #00ffaa;
        }

        .editor-input, .editor-select {
            width: 100%;
            padding: 8px;
            background: #050b14;
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: #00f0ff;
            font-family: 'Rajdhani', sans-serif;
            border-radius: 4px;
            outline: none;
        }

        .editor-btn {
            background: #00f0ff;
            color: #050b14;
            border: none;
            padding: 8px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .editor-btn:hover {
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa;
        }

        .editor-btn.export {
            background: #ff0055;
            color: #fff;
        }
        .editor-btn.export:hover {
            background: #ff3377;
            box-shadow: 0 0 10px #ff0055;
        }

        /* Bottom HUD Navigation Control */
        .hud-nav-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(5, 15, 30, 0.8);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 30px;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .hud-btn:hover, .hud-btn.active {
            background: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 15px #00f0ff;
            font-weight: bold;
        }

        /* Footer Proprietary Tag */
        .hud-copyright {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- Panorama Canvas -->
    <div id="panorama"></div>

    <!-- HUD Overlay -->
    <div class="hud-overlay">
        <!-- Header -->
        <div class="hud-header">
            <div class="hud-title-box">
                <div class="hud-logo"></div>
                <div class="hud-title">Pano_Viewer Configurator</div>
            </div>
            <div class="hud-status">
                <div class="status-dot"></div>
                EDITOR MODE ENABLED
            </div>
        </div>

        <!-- Node Configuration Panel -->
        <div id="editor-panel">
            <div class="editor-title">🎯 LIVE NODE POSITIONING</div>
            
            <div class="coord-display">
                PITCH: <span id="val-pitch">0.0</span>°<br>
                YAW: <span id="val-yaw">0.0</span>°
            </div>

            <input type="text" id="hotspot-text" class="editor-input" placeholder="Hotspot Label (e.g. GOTO HALL)" value="ENTER INTERIOR">
            
            <select id="target-scene" class="editor-select">
                <option value="stairway">Target: Stairway</option>
                <option value="interior">Target: Interior</option>
                <option value="meeting_room">Target: Meeting Room</option>
                <option value="museum">Target: Museum</option>
            </select>

            <button class="editor-btn" onclick="addNodeToCurrentScene()">➕ Place Node Here</button>
            <button class="editor-btn export" onclick="exportConfig()">💾 Export Saved Config</button>
        </div>

        <!-- Navigation HUD Toolbar -->
        <div class="hud-nav-bar">
            <button class="hud-btn active" id="btn-stairway" onclick="switchScene('stairway')">Stairway</button>
            <button class="hud-btn" id="btn-interior" onclick="switchScene('interior')">Interior</button>
            <button class="hud-btn" id="btn-meeting_room" onclick="switchScene('meeting_room')">Meeting Room</button>
            <button class="hud-btn" id="btn-museum" onclick="switchScene('museum')">Museum</button>
        </div>

        <!-- Proprietary Tag -->
        <div class="hud-copyright">
            PROPRIETARY TOOL © Rituraj_Gogoi
        </div>
    </div>

<script>
    // Config JSON Structure
    var tourScenes = {
        "stairway": {
            "title": "Church Stairway Entrance",
            "hfov": 100,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "church_stairway_4k.jpg",
            "hotSpots": [
                { "pitch": 12.0, "yaw": 18.0, "type": "scene", "text": "ENTER INTERIOR MAIN HALL", "sceneId": "interior" },
                { "pitch": -10.0, "yaw": -25.0, "type": "scene", "text": "GO TO MUSEUM", "sceneId": "museum" }
            ]
        },
        "interior": {
            "title": "Church Interior Hall",
            "hfov": 100,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "church_interior_4k.jpg",
            "hotSpots": [
                { "pitch": -1.0, "yaw": -120.0, "type": "scene", "text": "EXIT TO STAIRWAY", "sceneId": "stairway" },
                { "pitch": 0.0, "yaw": 60.0, "type": "scene", "text": "ENTER MEETING ROOM", "sceneId": "meeting_room" },
                { "pitch": 0.0, "yaw": -60.0, "type": "scene", "text": "ENTER MUSEUM", "sceneId": "museum" }
            ]
        },
        "meeting_room": {
            "title": "Church Meeting Room",
            "hfov": 100,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "church_meeting_room_4k.jpg",
            "hotSpots": [
                { "pitch": -2.0, "yaw": 180.0, "type": "scene", "text": "RETURN TO INTERIOR", "sceneId": "interior" }
            ]
        },
        "museum": {
            "title": "Church Museum",
            "hfov": 100,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "church_museum_4k.jpg",
            "hotSpots": [
                { "pitch": -2.0, "yaw": 160.0, "type": "scene", "text": "RETURN TO INTERIOR", "sceneId": "interior" }
            ]
        }
    };

    var currentClickCoords = { pitch: 0, yaw: 0 };

    // Initialize Viewer
    var viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "stairway",
            "author": "Rituraj_Gogoi",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": false,
            "hotSpotDebug": false
        },
        "scenes": tourScenes
    });

    // Real-Time Position Mouse Detection
    document.getElementById('panorama').addEventListener('mousedown', function(event) {
        var coords = viewer.canvasToFinalBounds(event);
        if(coords) {
            currentClickCoords.pitch = parseFloat(coords[0].toFixed(2));
            currentClickCoords.yaw = parseFloat(coords[1].toFixed(2));

            document.getElementById('val-pitch').innerText = currentClickCoords.pitch;
            document.getElementById('val-yaw').innerText = currentClickCoords.yaw;
        }
    });

    // Add New Hotspot Node Dynamically
    function addNodeToCurrentScene() {
        var activeScene = viewer.getScene();
        var labelText = document.getElementById('hotspot-text').value;
        var targetScene = document.getElementById('target-scene').value;

        var newHotspot = {
            "pitch": currentClickCoords.pitch,
            "yaw": currentClickCoords.yaw,
            "type": "scene",
            "text": labelText,
            "sceneId": targetScene
        };

        // Add Hotspot to Live View
        viewer.addHotSpot(newHotspot, activeScene);

        // Push to local data tree
        tourScenes[activeScene].hotSpots.push(newHotspot);

        alert('Node Placed in ' + activeScene + '!\nPitch: ' + currentClickCoords.pitch + ' | Yaw: ' + currentClickCoords.yaw);
    }

    // Export & Download JSON Config file for permanent save
    function exportConfig() {
        var formattedData = "var tourScenes = " + JSON.stringify(tourScenes, null, 4) + ";";
        
        // Copy to clipboard
        navigator.clipboard.writeText(formattedData);
        alert("Configuration copied to clipboard! You can replace 'var tourScenes' in your code now.");

        // Create downloadable JSON file
        var blob = new Blob([formattedData], { type: "text/javascript" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "scenes_config.js";
        a.click();
    }

    // Switch Scene Handlers
    function switchScene(sceneId) {
        viewer.loadScene(sceneId);
        updateNavState(sceneId);
    }

    viewer.on('scenechange', function(sceneId) {
        updateNavState(sceneId);
    });

    function updateNavState(sceneId) {
        document.querySelectorAll('.hud-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('btn-' + sceneId);
        if (activeBtn) activeBtn.classList.add('active');
    }
</script>

</body>
</html>
