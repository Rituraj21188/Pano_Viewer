<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano_Viewer - 3D Visual Node Editor</title>
    
    <!-- Pannellum Engine -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }

        /* HIDE NATIVE CURSOR WHEN CUSTOM CURSOR IS ACTIVE */
        body.custom-cursor, body.custom-cursor * { cursor: none !important; }

        #panorama { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* CUSTOM RETICLE CURSOR */
        #custom-cursor {
            position: fixed; top: 0; left: 0; width: 20px; height: 20px;
            pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
        }
        .cursor-crosshair { border: 2px solid #00f0ff; border-radius: 50%; box-shadow: 0 0 10px #00f0ff; }
        .cursor-crosshair::after { content: ''; width: 4px; height: 4px; background: #00f0ff; border-radius: 50%; }
        .cursor-target { border: 2px dashed #00ffaa; border-radius: 50%; box-shadow: 0 0 12px #00ffaa; }
        .cursor-laser { width: 10px !important; height: 10px !important; background: #ff0055; border-radius: 50%; box-shadow: 0 0 15px #ff0055; }

        /* HUD TOP HEADER */
        .hud-header {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10;
            background: rgba(5, 15, 30, 0.85); border: 1px solid #00f0ff; border-left: 5px solid #00f0ff;
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(8px);
        }
        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; letter-spacing: 2px; }
        .hud-badge { font-size: 11px; background: #00ffaa; color: #000; padding: 2px 8px; font-weight: bold; border-radius: 3px; }

        /* VISUAL 3D EDITOR CONTROL PANEL */
        #editor-panel {
            position: absolute; top: 75px; right: 15px; z-index: 10; width: 320px;
            background: rgba(5, 15, 30, 0.9); border: 1px solid rgba(0,240,255,0.5);
            padding: 15px; border-radius: 6px; color: #00f0ff; backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); display: flex; flex-direction: column; gap: 8px;
        }
        .panel-title { font-family: 'Orbitron', sans-serif; font-size: 12px; color: #fff; border-bottom: 1px solid rgba(0,240,255,0.3); padding-bottom: 4px; }
        
        .field-group { display: flex; flex-direction: column; gap: 3px; }
        .field-label { font-size: 11px; color: rgba(255,255,255,0.7); }
        .editor-input, .editor-select {
            background: #050b14; border: 1px solid #00f0ff; color: #00f0ff;
            padding: 6px; font-family: 'Rajdhani', sans-serif; font-size: 13px; outline: none; border-radius: 3px;
        }

        .btn {
            background: #00f0ff; color: #000; border: none; padding: 8px;
            font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: 0.2s; border-radius: 3px; text-transform: uppercase;
        }
        .btn:hover { background: #00ffaa; box-shadow: 0 0 10px #00ffaa; }
        .btn-danger { background: #ff0055; color: #fff; }
        .btn-danger:hover { background: #ff3377; box-shadow: 0 0 10px #ff0055; }
        .btn-save { background: #00ffaa; color: #000; }

        /* LIVE DRAGGABLE NODE STYLING */
        .node-marker {
            width: 32px; height: 32px; background: rgba(0, 240, 255, 0.2);
            border: 2px solid #00f0ff; border-radius: 50%; cursor: move;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #00f0ff; transition: transform 0.1s;
        }
        .node-marker:hover { transform: scale(1.2); background: rgba(0, 255, 170, 0.4); border-color: #00ffaa; }
        .node-marker.selected { border-color: #ff0055; box-shadow: 0 0 20px #ff0055; }
        .node-marker::after { content: '🎯'; font-size: 14px; }

        /* BOTTOM TOOLBAR NAVIGATION */
        .hud-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 10px; background: rgba(5, 15, 30, 0.85); padding: 8px 16px;
            border-radius: 20px; border: 1px solid #00f0ff; backdrop-filter: blur(8px);
        }
        .nav-btn {
            background: transparent; border: 1px solid rgba(0,240,255,0.4); color: #00f0ff;
            padding: 5px 12px; font-family: 'Orbitron', sans-serif; font-size: 11px; cursor: pointer; border-radius: 12px;
        }
        .nav-btn.active, .nav-btn:hover { background: #00f0ff; color: #000; font-weight: bold; }

        .hud-copy { position: absolute; bottom: 10px; right: 15px; z-index: 10; font-size: 10px; color: rgba(255,255,255,0.4); font-family: 'Orbitron'; }
    </style>
</head>
<body class="custom-cursor">

    <div id="panorama"></div>
    <div id="custom-cursor" class="cursor-crosshair"></div>

    <!-- HUD OVERLAY -->
    <div class="hud-header">
        <div class="hud-title">PANO_VIEWER 3D EDITOR</div>
        <div class="hud-badge">MODE: REAL-TIME PLACEMENT</div>
    </div>

    <!-- 3D EDITOR CONTROLLER -->
    <div id="editor-panel">
        <div class="panel-title">🎯 LIVE NODE EDITOR</div>
        
        <div class="field-group">
            <span class="field-label">CLICKED COORDINATES</span>
            <div style="font-family: monospace; font-size: 12px; color:#00ffaa;">
                PITCH: <span id="lbl-pitch">0.00</span>° | YAW: <span id="lbl-yaw">0.00</span>°
            </div>
        </div>

        <div class="field-group">
            <span class="field-label">NODE LABEL TEXT</span>
            <input type="text" id="node-text" class="editor-input" value="GO TO ROOM">
        </div>

        <div class="field-group">
            <span class="field-label">TARGET DESTINATION ROOM</span>
            <select id="node-target" class="editor-select">
                <option value="stairway">Stairway</option>
                <option value="interior">Interior</option>
                <option value="meeting_room">Meeting Room</option>
                <option value="museum">Museum</option>
            </select>
        </div>

        <button class="btn" onclick="createNewNode()">➕ CREATE NODE AT CLICK</button>
        <button class="btn btn-danger" onclick="deleteSelectedNode()">🗑️ DELETE SELECTED NODE</button>

        <div class="panel-title" style="margin-top:5px;">🖱️ CURSOR SYSTEM</div>
        <select class="editor-select" onchange="setCursorStyle(this.value)">
            <option value="cursor-crosshair">Sci-Fi Crosshair</option>
            <option value="cursor-target">Target Ring</option>
            <option value="cursor-laser">Laser Pointer</option>
            <option value="default">Default System Cursor</option>
        </select>

        <button class="btn btn-save" onclick="saveConfigurationPermanently()" style="margin-top:6px;">💾 SAVE LAYOUT TO APP</button>
    </div>

    <!-- ROOM SWITCHING TOOLBAR -->
    <div class="hud-nav">
        <button class="nav-btn active" id="btn-stairway" onclick="loadRoom('stairway')">Stairway</button>
        <button class="nav-btn" id="btn-interior" onclick="loadRoom('interior')">Interior</button>
        <button class="nav-btn" id="btn-meeting_room" onclick="loadRoom('meeting_room')">Meeting Room</button>
        <button class="nav-btn" id="btn-museum" onclick="loadRoom('museum')">Museum</button>
    </div>

    <div class="hud-copy">PROPRIETARY TOOL © Rituraj_Gogoi</div>

<script>
    // DEFAULT PANORAMA & NODE TREE
    var defaultData = {
        "cursor": "cursor-crosshair",
        "scenes": {
            "stairway": {
                "title": "Church Stairway Entrance",
                "panorama": "church_stairway_4k.jpg",
                "nodes": [
                    { "id": "node_1", "pitch": 12.0, "yaw": 18.0, "text": "ENTER INTERIOR MAIN HALL", "target": "interior" },
                    { "id": "node_2", "pitch": -10.0, "yaw": -25.0, "text": "GO TO MUSEUM", "target": "museum" }
                ]
            },
            "interior": {
                "title": "Church Interior Hall",
                "panorama": "church_interior_4k.jpg",
                "nodes": [
                    { "id": "node_3", "pitch": -1.0, "yaw": -120.0, "text": "EXIT TO STAIRWAY", "target": "stairway" },
                    { "id": "node_4", "pitch": 0.0, "yaw": 60.0, "text": "ENTER MEETING ROOM", "target": "meeting_room" },
                    { "id": "node_5", "pitch": 0.0, "yaw": -60.0, "text": "ENTER MUSEUM", "target": "museum" }
                ]
            },
            "meeting_room": {
                "title": "Church Meeting Room",
                "panorama": "church_meeting_room_4k.jpg",
                "nodes": [
                    { "id": "node_6", "pitch": -2.0, "yaw": 180.0, "text": "RETURN TO INTERIOR", "target": "interior" }
                ]
            },
            "museum": {
                "title": "Church Museum",
                "panorama": "church_museum_4k.jpg",
                "nodes": [
                    { "id": "node_7", "pitch": -2.0, "yaw": 160.0, "text": "RETURN TO INTERIOR", "target": "interior" }
                ]
            }
        }
    };

    // LOAD SAVED APP DATA OR FALLBACK TO DEFAULT
    var appData = JSON.parse(localStorage.getItem('PANO_EDITOR_CONFIG')) || defaultData;
    var viewer, activeScene = 'stairway';
    var lastClickedCoords = { pitch: 0, yaw: 0 };
    var selectedNodeId = null;

    // CUSTOM CURSOR TRACKER
    const cursorEl = document.getElementById('custom-cursor');
    window.addEventListener('mousemove', (e) => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top = e.clientY + 'px';
    });

    function setCursorStyle(styleClass) {
        appData.cursor = styleClass;
        cursorEl.className = '';
        if (styleClass === 'default') {
            document.body.classList.remove('custom-cursor');
            cursorEl.style.display = 'none';
        } else {
            document.body.classList.add('custom-cursor');
            cursorEl.style.display = 'flex';
            cursorEl.classList.add(styleClass);
        }
    }

    // RENDER HOTSPOTS INTO PANNELLUM
    function buildPannellumScenes() {
        var formattedScenes = {};
        Object.keys(appData.scenes).forEach(function(roomKey) {
            var room = appData.scenes[roomKey];
            formattedScenes[roomKey] = {
                "title": room.title,
                "type": "equirectangular",
                "panorama": room.panorama,
                "hotSpots": room.nodes.map(function(n) {
                    return {
                        "id": n.id,
                        "pitch": n.pitch,
                        "yaw": n.yaw,
                        "cssClass": "node-marker",
                        "createTooltipFunc": function(hotSpotDiv) {
                            hotSpotDiv.title = n.text + " ➔ " + n.target;
                            hotSpotDiv.onclick = function(e) {
                                e.stopPropagation();
                                selectedNodeId = n.id;
                                highlightSelectedNode(hotSpotDiv);
                            };
                            hotSpotDiv.ondblclick = function(e) {
                                e.stopPropagation();
                                loadRoom(n.target);
                            };
                        }
                    };
                })
            };
        });
        return formattedScenes;
    }

    // INITIALIZE VIEWER
    window.onload = function() {
        setCursorStyle(appData.cursor);
        
        viewer = pannellum.viewer('panorama', {
            "default": { "firstScene": "stairway", "autoLoad": true, "showControls": false },
            "scenes": buildPannellumScenes()
        });

        // CLICK CANVAS TO CAPTURE 3D SPATIAL COORDINATES
        document.getElementById('panorama').addEventListener('mousedown', function(e) {
            var coords = viewer.canvasToFinalBounds(e);
            if (coords) {
                lastClickedCoords.pitch = parseFloat(coords[0].toFixed(2));
                lastClickedCoords.yaw = parseFloat(coords[1].toFixed(2));
                document.getElementById('lbl-pitch').innerText = lastClickedCoords.pitch;
                document.getElementById('lbl-yaw').innerText = lastClickedCoords.yaw;
            }
        });
    };

    // CREATE NEW NODE AT CLICKED PLACE
    function createNewNode() {
        var text = document.getElementById('node-text').value;
        var target = document.getElementById('node-target').value;
        var newId = "node_" + Date.now();

        var newNode = {
            "id": newId,
            "pitch": lastClickedCoords.pitch,
            "yaw": lastClickedCoords.yaw,
            "text": text,
            "target": target
        };

        appData.scenes[activeScene].nodes.push(newNode);
        refreshSceneView();
    }

    // DELETE SELECTED NODE
    function deleteSelectedNode() {
        if (!selectedNodeId) return alert("Select a node marker first!");
        appData.scenes[activeScene].nodes = appData.scenes[activeScene].nodes.filter(n => n.id !== selectedNodeId);
        selectedNodeId = null;
        refreshSceneView();
    }

    // HIGHLIGHT SELECTED NODE
    function highlightSelectedNode(el) {
        document.querySelectorAll('.node-marker').forEach(m => m.classList.remove('selected'));
        el.classList.add('selected');
    }

    // REFRESH VIEWER SCENE DATA
    function refreshSceneView() {
        var currentPitch = viewer.getPitch();
        var currentYaw = viewer.getYaw();
        
        // Destroy & rebuild with updated node placements
        viewer.destroy();
        viewer = pannellum.viewer('panorama', {
            "default": { "firstScene": activeScene, "autoLoad": true, "showControls": false },
            "scenes": buildPannellumScenes()
        });
        
        viewer.setPitch(currentPitch);
        viewer.setYaw(currentYaw);
    }

    // NAVIGATE ROOMS
    function loadRoom(roomKey) {
        activeScene = roomKey;
        selectedNodeId = null;
        viewer.loadScene(roomKey);

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        var btn = document.getElementById('btn-' + roomKey);
        if (btn) btn.classList.add('active');
    }

    // PERMANENT STORAGE
    function saveConfigurationPermanently() {
        localStorage.setItem('PANO_EDITOR_CONFIG', JSON.stringify(appData));
        alert("LAYOUT SAVED SUCCESSFULLY!\nAll node placements are stored inside the app and will load automatically.");
    }
</script>
</body>
</html>
