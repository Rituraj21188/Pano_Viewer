<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano_Viewer - 3D Visual Node Editor</title>
    
    <!-- Pannellum Engine -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }

        #panorama { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD TOP HEADER */
        .hud-header {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10;
            background: rgba(5, 15, 30, 0.85); border: 1px solid #00f0ff; border-left: 5px solid #00f0ff;
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(8px); pointer-events: none;
        }
        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; letter-spacing: 2px; }
        .hud-badge { font-size: 11px; background: #00ffaa; color: #000; padding: 2px 8px; font-weight: bold; border-radius: 3px; }

        /* VISUAL 3D EDITOR CONTROL PANEL */
        #editor-panel {
            position: absolute; top: 75px; right: 15px; z-index: 1000; width: 330px;
            background: rgba(5, 15, 30, 0.92); border: 1px solid rgba(0,240,255,0.6);
            padding: 15px; border-radius: 8px; color: #00f0ff; backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); display: flex; flex-direction: column; gap: 8px;
        }
        .panel-title { font-family: 'Orbitron', sans-serif; font-size: 12px; color: #fff; border-bottom: 1px solid rgba(0,240,255,0.3); padding-bottom: 4px; }
        
        .field-group { display: flex; flex-direction: column; gap: 3px; }
        .field-label { font-size: 11px; color: rgba(255,255,255,0.7); }
        .editor-input, .editor-select {
            background: #050b14; border: 1px solid #00f0ff; color: #00f0ff;
            padding: 8px; font-family: 'Rajdhani', sans-serif; font-size: 13px; outline: none; border-radius: 4px;
        }

        .btn {
            background: #00f0ff; color: #000; border: none; padding: 10px;
            font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: 0.2s; border-radius: 4px; text-transform: uppercase;
        }
        .btn:hover { background: #00ffaa; box-shadow: 0 0 12px #00ffaa; }
        .btn-center { background: #ffe600; color: #000; }
        .btn-center:hover { background: #fff066; box-shadow: 0 0 12px #ffe600; }
        .btn-danger { background: #ff0055; color: #fff; }
        .btn-danger:hover { background: #ff3377; box-shadow: 0 0 12px #ff0055; }
        .btn-save { background: #00ffaa; color: #000; }

        /* LIVE NODE STYLING */
        .node-marker {
            width: 36px; height: 36px; background: rgba(0, 240, 255, 0.3);
            border: 2px solid #00f0ff; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #00f0ff; transition: all 0.2s;
        }
        .node-marker:hover { transform: scale(1.25); background: rgba(0, 255, 170, 0.5); border-color: #00ffaa; }
        .node-marker.selected { border-color: #ff0055; box-shadow: 0 0 25px #ff0055; background: rgba(255,0,85,0.4); }
        .node-marker::after { content: '🎯'; font-size: 16px; }

        /* CENTER CROSSHAIR POINTER */
        .center-crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; border: 1px solid rgba(0, 240, 255, 0.5); border-radius: 50%;
            pointer-events: none; z-index: 5;
        }
        .center-crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #00f0ff; transform: translate(-50%, -50%); border-radius: 50%;
        }

        /* BOTTOM TOOLBAR NAVIGATION */
        .hud-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; gap: 10px; background: rgba(5, 15, 30, 0.85); padding: 8px 16px;
            border-radius: 20px; border: 1px solid #00f0ff; backdrop-filter: blur(8px);
        }
        .nav-btn {
            background: transparent; border: 1px solid rgba(0,240,255,0.4); color: #00f0ff;
            padding: 6px 14px; font-family: 'Orbitron', sans-serif; font-size: 11px; cursor: pointer; border-radius: 12px;
        }
        .nav-btn.active, .nav-btn:hover { background: #00f0ff; color: #000; font-weight: bold; }

        .hud-copy { position: absolute; bottom: 10px; right: 15px; z-index: 10; font-size: 10px; color: rgba(255,255,255,0.4); font-family: 'Orbitron'; pointer-events: none; }
    </style>
</head>
<body>

    <!-- PANORAMA CANVAS -->
    <div id="panorama"></div>

    <!-- CENTER RETICLE AIM -->
    <div class="center-crosshair"></div>

    <!-- HUD OVERLAY -->
    <div class="hud-header">
        <div class="hud-title">PANO_VIEWER 3D EDITOR</div>
        <div class="hud-badge">STATUS: ANGLE LOOKUP ACTIVE</div>
    </div>

    <!-- 3D EDITOR CONTROLLER -->
    <div id="editor-panel">
        <div class="panel-title">🎯 LIVE NODE POSITIONING</div>
        
        <div class="field-group">
            <span class="field-label">TARGET VIEWING ANGLE</span>
            <div style="font-family: monospace; font-size: 13px; color:#00ffaa; background: rgba(0,240,255,0.1); padding: 6px; border-radius: 4px;">
                PITCH: <span id="lbl-pitch">0.00</span>° | YAW: <span id="lbl-yaw">0.00</span>°
            </div>
        </div>

        <button class="btn btn-center" onclick="captureCenterViewAngle()">🎯 CAPTURE CENTER VIEW ANGLE</button>

        <div class="field-group">
            <span class="field-label">NODE LABEL TEXT</span>
            <input type="text" id="node-text" class="editor-input" value="ENTER INTERIOR">
        </div>

        <div class="field-group">
            <span class="field-label">TARGET DESTINATION ROOM</span>
            <select id="node-target" class="editor-select">
                <option value="stairway">Stairway</option>
                <option value="interior">Interior</option>
                <option value="meeting_room">Meeting Room</option>
                <option value="museum">Museum</option>
            </select>
        </div>

        <button class="btn" onclick="createNewNode()">➕ PLACE NODE AT CAPTURED ANGLE</button>
        <button class="btn btn-danger" onclick="deleteSelectedNode()">🗑️ DELETE SELECTED NODE</button>
        <button class="btn btn-save" onclick="saveConfigurationPermanently()" style="margin-top:4px;">💾 SAVE LAYOUT TO APP</button>
    </div>

    <!-- ROOM SWITCHING TOOLBAR -->
    <div class="hud-nav">
        <button class="nav-btn active" id="btn-stairway" onclick="loadRoom('stairway')">Stairway</button>
        <button class="nav-btn" id="btn-interior" onclick="loadRoom('interior')">Interior</button>
        <button class="nav-btn" id="btn-meeting_room" onclick="loadRoom('meeting_room')">Meeting Room</button>
        <button class="nav-btn" id="btn-museum" onclick="loadRoom('museum')">Museum</button>
    </div>

    <div class="hud-copy">PROPRIETARY TOOL © Rituraj_Gogoi</div>

<script>
    // DEFAULT PANORAMA & NODE TREE
    var defaultData = {
        "scenes": {
            "stairway": {
                "title": "Church Stairway Entrance",
                "panorama": "church_stairway_4k.jpg",
                "nodes": [
                    { "id": "node_1", "pitch": 12.0, "yaw": 18.0, "text": "ENTER INTERIOR MAIN HALL", "target": "interior" },
                    { "id": "node_2", "pitch": -10.0, "yaw": -25.0, "text": "GO TO MUSEUM", "target": "museum" }
                ]
            },
            "interior": {
                "title": "Church Interior Hall",
                "panorama": "church_interior_4k.jpg",
                "nodes": [
                    { "id": "node_3", "pitch": -1.0, "yaw": -120.0, "text": "EXIT TO STAIRWAY", "target": "stairway" },
                    { "id": "node_4", "pitch": 0.0, "yaw": 60.0, "text": "ENTER MEETING ROOM", "target": "meeting_room" },
                    { "id": "node_5", "pitch": 0.0, "yaw": -60.0, "text": "ENTER MUSEUM", "target": "museum" }
                ]
            },
            "meeting_room": {
                "title": "Church Meeting Room",
                "panorama": "church_meeting_room_4k.jpg",
                "nodes": [
                    { "id": "node_6", "pitch": -2.0, "yaw": 180.0, "text": "RETURN TO INTERIOR", "target": "interior" }
                ]
            },
            "museum": {
                "title": "Church Museum",
                "panorama": "church_museum_4k.jpg",
                "nodes": [
                    { "id": "node_7", "pitch": -2.0, "yaw": 160.0, "text": "RETURN TO INTERIOR", "target": "interior" }
                ]
            }
        }
    };

    var appData = JSON.parse(localStorage.getItem('PANO_EDITOR_CONFIG')) || defaultData;
    var viewer, activeScene = 'stairway';
    var selectedAngle = { pitch: 0, yaw: 0 };
    var selectedNodeId = null;

    function buildPannellumScenes() {
        var formattedScenes = {};
        Object.keys(appData.scenes).forEach(function(roomKey) {
            var room = appData.scenes[roomKey];
            formattedScenes[roomKey] = {
                "title": room.title,
                "type": "equirectangular",
                "panorama": room.panorama,
                "hotSpots": room.nodes.map(function(n) {
                    return {
                        "id": n.id,
                        "pitch": n.pitch,
                        "yaw": n.yaw,
                        "cssClass": "node-marker",
                        "createTooltipFunc": function(hotSpotDiv) {
                            hotSpotDiv.title = n.text + " ➔ " + n.target;
                            hotSpotDiv.onclick = function(e) {
                                e.stopPropagation();
                                selectedNodeId = n.id;
                                highlightSelectedNode(hotSpotDiv);
                            };
                            hotSpotDiv.ondblclick = function(e) {
                                e.stopPropagation();
                                loadRoom(n.target);
                            };
                        }
                    };
                })
            };
        });
        return formattedScenes;
    }

    window.onload = function() {
        viewer = pannellum.viewer('panorama', {
            "default": { "firstScene": "stairway", "autoLoad": true, "showControls": false },
            "scenes": buildPannellumScenes()
        });

        // Dynamic Mouse Click Angle Detection
        document.getElementById('panorama').addEventListener('mouseup', function(e) {
            if (viewer) {
                var coords = viewer.mouseEventToCoords(e);
                if (coords && coords.length >= 2) {
                    selectedAngle.pitch = parseFloat(coords[0].toFixed(2));
                    selectedAngle.yaw = parseFloat(coords[1].toFixed(2));
                    updateUIReading();
                }
            }
        });
    };

    // CAPTURE CAMERA CENTER ANGLE (Guaranteed to work at any rotation angle)
    function captureCenterViewAngle() {
        if (!viewer) return;
        selectedAngle.pitch = parseFloat(viewer.getPitch().toFixed(2));
        selectedAngle.yaw = parseFloat(viewer.getYaw().toFixed(2));
        updateUIReading();
    }

    function updateUIReading() {
        document.getElementById('lbl-pitch').innerText = selectedAngle.pitch;
        document.getElementById('lbl-yaw').innerText = selectedAngle.yaw;
    }

    // CREATE NEW NODE DYNAMICALLY
    function createNewNode() {
        var text = document.getElementById('node-text').value;
        var target = document.getElementById('node-target').value;
        var newId = "node_" + Date.now();

        var newNode = {
            "id": newId,
            "pitch": selectedAngle.pitch,
            "yaw": selectedAngle.yaw,
            "text": text,
            "target": target
        };

        appData.scenes[activeScene].nodes.push(newNode);

        // Add hotspot directly without resetting screen view
        viewer.addHotSpot({
            "id": newId,
            "pitch": selectedAngle.pitch,
            "yaw": selectedAngle.yaw,
            "cssClass": "node-marker",
            "createTooltipFunc": function(hotSpotDiv) {
                hotSpotDiv.title = text + " ➔ " + target;
                hotSpotDiv.onclick = function(e) {
                    e.stopPropagation();
                    selectedNodeId = newId;
                    highlightSelectedNode(hotSpotDiv);
                };
                hotSpotDiv.ondblclick = function(e) {
                    e.stopPropagation();
                    loadRoom(target);
                };
            }
        }, activeScene);

        alert("Node successfully placed at Pitch: " + selectedAngle.pitch + "°, Yaw: " + selectedAngle.yaw + "°!");
    }

    // DELETE SELECTED NODE
    function deleteSelectedNode() {
        if (!selectedNodeId) return alert("Click a 🎯 node marker to select it first!");
        
        // Remove from data tree
        appData.scenes[activeScene].nodes = appData.scenes[activeScene].nodes.filter(n => n.id !== selectedNodeId);
        
        // Remove hotspot live from viewer
        viewer.removeHotSpot(selectedNodeId, activeScene);
        selectedNodeId = null;
    }

    function highlightSelectedNode(el) {
        document.querySelectorAll('.node-marker').forEach(m => m.classList.remove('selected'));
        el.classList.add('selected');
    }

    function loadRoom(roomKey) {
        activeScene = roomKey;
        selectedNodeId = null;
        viewer.loadScene(roomKey);

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        var btn = document.getElementById('btn-' + roomKey);
        if (btn) btn.classList.add('active');
    }

    function saveConfigurationPermanently() {
        localStorage.setItem('PANO_EDITOR_CONFIG', JSON.stringify(appData));
        alert("LAYOUT SAVED SUCCESSFULLY!\nAll node placements are stored and will load automatically on startup.");
    }
</script>
</body>
</html>
